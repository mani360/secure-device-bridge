name: Android build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble debug app
        run: ./gradlew :test-support:fake-device:test :app:lintDebug :data:security:lintDebug :app:assembleDebug --no-daemon
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: test-support/fake-device/build/reports/tests/test/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-device-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  keystore-instrumentation:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android Keystore on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :data:security:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon
            mkdir -p demo-screenshots
            adb pull /sdcard/Android/data/io.github.mani360.securedevicebridge/files/screenshots/. demo-screenshots/
      - name: Upload actual app screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots-api-${{ matrix.api-level }}
          path: demo-screenshots/*.png
          if-no-files-found: error
      - name: Upload Keystore instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystore-instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            data/security/build/reports/androidTests/
            data/security/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
